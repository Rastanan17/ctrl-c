<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1746a2">
    <meta name="description" content="Gestioná clientes, productos, entregas en consignación, ventas, pagos y comprobantes por WhatsApp.">
    <meta name="application-name" content="Ctrl+C">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ctrl+C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="images/ctrl-icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/ctrl-icon.png">
    <link rel="stylesheet" href="css/styles.css">
    <title>Ctrl+C</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup"><img class="app-logo" src="images/ctrl.png" alt="Logo de Ctrl+C">
        <div>
          <p class="eyebrow">Ctrl+C · Control de Consignaciones</p>
          <div class="business-title-row">
            <h1 id="business-name">Mi emprendimiento</h1>
            <button type="button" class="edit-business-button" id="business-edit-button" aria-label="Editar nombre del emprendimiento" title="Editar nombre">✎</button>
          </div>
          <p class="page-label" id="page-title">Mi Negocio</p>
        </div>
      </div>
      <button type="button" class="backup-button" id="backup-button" aria-label="Abrir respaldo" title="Respaldo"><span aria-hidden="true">⇩</span><span>Respaldo</span></button>
    </header>
    <main id="app" class="app-shell" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-route="inicio" class="nav-item active" type="button"><span>⌂</span>Inicio</button>
      <button data-route="clientes" class="nav-item" type="button"><span>♙</span>Clientes</button>
      <button data-route="entrega" class="nav-item nav-main" type="button"><span>＋</span>Entrega</button>
      <button data-route="productos" class="nav-item" type="button"><span>▣</span>Productos</button>
      <button data-route="historial" class="nav-item" type="button"><span>≡</span>Historial</button>
    </nav>
    <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
    <div id="toast" class="toast" role="status"></div>
    <input type="file" id="import-file" accept="application/json" hidden>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
